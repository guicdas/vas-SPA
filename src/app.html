<!doctype html>
<html lang="pt-PT">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/banner.jpg" type="image/jpeg" />
		<script>
			// Old links used "#slug"; send them to the real "/slug/" page.
			if (location.pathname === "/" && location.hash.length > 1) location.replace(`/${location.hash.slice(1)}/`);
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
